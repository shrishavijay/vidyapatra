<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidyaPatra — Question Paper Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>VidyaPatra</h1>
      <p>Free question papers for Indian students</p>
    </div>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search by subject, college, or year...">
      <select id="stream-filter">
        <option value="all">All Streams</option>
        <option value="science">Science</option>
        <option value="commerce">Commerce</option>
        <option value="arts">Arts</option>
      </select>
    </div>

    <div class="cards-grid" id="papers-container">
      <!-- JavaScript will put cards here -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
